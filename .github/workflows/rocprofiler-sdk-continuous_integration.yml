name: rocprofiler-sdk Continuous Integration

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * *'
  push:
    branches: [develop]
    paths:
      - 'projects/rocprofiler-sdk/**'
      - '.github/workflows/rocprofiler-sdk-continuous_integration.yml'
      - '!**/*.md'
      - '!**/*.rtf'
      - '!**/*.rst'
      - '!**/.markdownlint-ci2.yaml'
      - '!**/.readthedocs.yaml'
      - '!**/.spellcheck.local.yaml'
      - '!**/.wordlist.txt'
      - '!projects/rocprofiler-sdk/CODEOWNERS'
      - '!projects/rocprofiler-sdk/source/docs/**'
  pull_request:
    paths:
      - 'projects/rocprofiler-sdk/**'
      - '.github/workflows/rocprofiler-sdk-continuous_integration.yml'
      - '!**/*.md'
      - '!**/*.rtf'
      - '!**/*.rst'
      - '!**/.markdownlint-ci2.yaml'
      - '!**/.readthedocs.yaml'
      - '!**/.spellcheck.local.yaml'
      - '!**/.wordlist.txt'
      - '!projects/rocprofiler-sdk/CODEOWNERS'
      - '!projects/rocprofiler-sdk/source/docs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

env:
  ROCM_PATH: "/opt/rocm"
  GPU_TARGETS: "gfx906 gfx908 gfx90a gfx942 gfx950 gfx1030 gfx1100 gfx1101 gfx1102 gfx1201"
  GLOBAL_CMAKE_OPTIONS: ""
  ENABLE_ROCR_BUILD: "true"
  ENABLE_HIP_CLR_BUILD: "true"
  CI_MODE: ${{ github.event_name == 'schedule' && 'Nightly' || 'Continuous' }}
  mi325_EXCLUDE_TESTS_REGEX: ""
  mi325_EXCLUDE_LABEL_REGEX: ""

jobs:
  discover-rocm-tarball:
    name: Discover ROCm Tarball
    runs-on: ubuntu-latest
    outputs:
      tarball_version: ${{ steps.discover.outputs.tarball_version }}
    steps:
      - name: Discover latest nightly tarball
        id: discover
        run: |
          BASE_URL="https://rocm.nightlies.amd.com/tarball/"
          TARBALL_VERSION=$(curl -sL "${BASE_URL}" | grep -oP 'therock-dist-linux-gfx94X-dcgpu-\K[0-9]+\.[0-9]+\.[0-9a-z]+' | sort -V | tail -1)
          if [ -z "$TARBALL_VERSION" ]; then
            echo "ERROR: Failed to discover tarball version from ${BASE_URL}"
            exit 1
          fi
          echo "tarball_version=${TARBALL_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Discovered tarball version: ${TARBALL_VERSION}"

  core-deb:
    name: Core • ${{ matrix.system.gpu }} • ${{ matrix.system.os }}
    needs: [discover-rocm-tarball]
    strategy:
      fail-fast: false
      matrix:
        system:
          - { gpu: 'mi325', runner: 'linux-mi325-1gpu-ossci-rocm', os: 'ubuntu-22.04', build-type: 'RelWithDebInfo', ci-flags: '--linter clang-tidy', gpu-target: 'gfx94X-dcgpu' }
    runs-on: ${{ matrix.system.runner }}
    container:
      image: ubuntu:22.04
      options: --privileged
    env:
      GIT_DISCOVERY_ACROSS_FILESYSTEM: 1
      CORE_EXT_RUNNER: mi325
      GPU_RUNNER: ${{ matrix.system.gpu }}
      DEBIAN_FRONTEND: noninteractive
      TARBALL_VERSION: ${{ needs.discover-rocm-tarball.outputs.tarball_version }}
    steps:
      - name: Install base dependencies
        run: |
          apt-get update && apt-get install -y --no-install-recommends \
            ca-certificates curl wget git git-lfs build-essential g++-11 g++-12 cmake ninja-build \
            python3 python3-pip python3-venv libelf1 libelf-dev libnuma1 libnuma-dev libunwind8 libncurses6 \
            libdw-dev libsqlite3-dev libdrm-dev libzstd-dev perl file autoconf pkg-config rpm kmod software-properties-common ccache xxd \
            libgl1-mesa-dev libglu1-mesa-dev libglx-dev libegl1-mesa-dev
          apt-get install -y --no-install-recommends libssl3 || apt-get install -y --no-install-recommends libssl1.1 || true
          update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-12 20 --slave /usr/bin/g++ g++ /usr/bin/g++-12 --slave /usr/bin/gcov gcov /usr/bin/gcov-12

      - name: Install ROCm from nightly tarball
        run: |
          TARBALL_URL="https://rocm.nightlies.amd.com/tarball/therock-dist-linux-${{ matrix.system.gpu-target }}-${{ env.TARBALL_VERSION }}.tar.gz"
          echo "Installing ROCm from ${TARBALL_URL}"
          curl -fsSL -o /tmp/rocm.tar.gz "$TARBALL_URL"
          mkdir -p /opt/rocm && tar -xzf /tmp/rocm.tar.gz -C /opt/rocm --strip-components=1
          rm -f /tmp/rocm.tar.gz

      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            projects/rocprofiler-sdk
            projects/aqlprofile
            projects/rocprofiler-register
            projects/rocr-runtime
            projects/clr
            projects/hip
          submodules: false
          set-safe-directory: true

      - name: Init submodules
        run: |
          git config --global --add safe.directory '*'
          git submodule update --init --recursive --jobs 16

      - name: Install Python requirements
        working-directory: projects/rocprofiler-sdk
        run: |
          python3 -m pip install -U --user -r requirements.txt cmake==3.24.0 CppHeaderParser
          rm -rf /opt/rocm/lib/*rocprofiler-sdk* /opt/rocm/lib/cmake/*rocprofiler-sdk* /opt/rocm/share/*rocprofiler-sdk* /opt/rocm/libexec/*rocprofiler-sdk*

      - name: Setup environment
        run: |
          echo "PATH=$HOME/.local/bin:/opt/rocm/bin:/opt/rocm/llvm/bin:$PATH" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=/opt/rocm/lib:/opt/rocm/llvm/lib:${LD_LIBRARY_PATH}" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=/opt/amdgpu/lib64/pkgconfig:/opt/amdgpu/lib/pkgconfig:${PKG_CONFIG_PATH}" >> $GITHUB_ENV

      - uses: hendrikmuhs/ccache-action@63069e3931dedbf3b63792097479563182fe70d1
        with: { key: 'ccache-${{ matrix.system.os }}-${{ matrix.system.gpu }}', max-size: '2G', save: true }

      - name: Build ROCProfiler-Register
        working-directory: projects/rocprofiler-register
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_PREFIX_PATH=/opt/rocm -DCMAKE_INSTALL_PREFIX=/opt/rocm \
            -DCMAKE_C_COMPILER_LAUNCHER=/usr/bin/ccache -DCMAKE_CXX_COMPILER_LAUNCHER=/usr/bin/ccache .
          cmake --build build --parallel 16 && cmake --build build --target install

      - name: Build ROCR-Runtime
        if: ${{ env.ENABLE_ROCR_BUILD == 'true' }}
        working-directory: projects/rocr-runtime
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_PREFIX_PATH='/opt/rocm;/opt/rocm/llvm' -DCMAKE_INSTALL_PREFIX=/opt/rocm .
          cmake --build build --parallel 16 && cmake --build build --target install

      - name: Build HIP
        if: ${{ env.ENABLE_HIP_CLR_BUILD == 'true' }}
        working-directory: projects/clr
        run: |
          cmake -B build -DHIP_COMMON_DIR=${{ github.workspace }}/projects/hip -DCMAKE_BUILD_TYPE=RelWithDebInfo -DHIP_PLATFORM=amd \
            -DCMAKE_PREFIX_PATH='/opt/rocm;/opt/rocm/llvm' -DCMAKE_INSTALL_PREFIX=/opt/rocm -DHIP_LLVM_ROOT=/opt/rocm/lib/llvm \
            -DHIP_CATCH_TEST=0 -DCLR_BUILD_HIP=ON -DCLR_BUILD_OCL=OFF .
          cmake --build build --parallel 16 && cmake --build build --target install

      - name: Build Aqlprofile
        working-directory: projects/aqlprofile
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_PREFIX_PATH=/opt/rocm -DCMAKE_INSTALL_PREFIX=/opt/rocm \
            -DCMAKE_C_COMPILER_LAUNCHER=/usr/bin/ccache -DCMAKE_CXX_COMPILER_LAUNCHER=/usr/bin/ccache .
          cmake --build build --parallel 16 && cmake --build build --target install

      - name: Configure, Build, and Test
        timeout-minutes: 30
        working-directory: projects/rocprofiler-sdk
        run: |
          python3 ./source/scripts/run-ci.py -B build \
            --name ${{ github.repository }}-${{ github.ref_name }}-${{ matrix.system.os }}-${{ matrix.system.gpu }}-core \
            --build-jobs 16 --mode ${CI_MODE} --site ${{ matrix.system.runner }} \
            --gpu-targets ${{ env.GPU_TARGETS }} --run-attempt ${{ github.run_attempt }} ${{ matrix.system.ci-flags }} -- \
            -DROCPROFILER_DEP_ROCMCORE=ON -DROCPROFILER_BUILD_DOCS=OFF -DROCPROFILER_INTERNAL_RCCL_API_TRACE=ON \
            -DCMAKE_BUILD_TYPE=${{ matrix.system.build-type }} -DCMAKE_INSTALL_PREFIX=/opt/rocprofiler-sdk \
            -DCPACK_GENERATOR='DEB;RPM;TGZ' -DCPACK_PACKAGING_INSTALL_PREFIX=/opt/rocm \
            -DPython3_EXECUTABLE=$(which python3) -DCMAKE_PREFIX_PATH='/opt/rocm;/opt/rocm/llvm' ${{ env.GLOBAL_CMAKE_OPTIONS }} -- --parallel 4

      - name: Install & Package
        if: ${{ contains(matrix.system.gpu, env.CORE_EXT_RUNNER) }}
        working-directory: projects/rocprofiler-sdk
        run: |
          cmake --build build --target install --parallel 16
          cmake --build build --target package --parallel 16

      - name: Test Install
        if: ${{ contains(matrix.system.gpu, env.CORE_EXT_RUNNER) }}
        working-directory: projects/rocprofiler-sdk
        run: |
          CMAKE_PREFIX_PATH=/opt/rocprofiler-sdk cmake -B build-samples samples
          CMAKE_PREFIX_PATH=/opt/rocprofiler-sdk cmake -B build-tests -DGPU_TARGETS="gfx942" tests
          export LD_LIBRARY_PATH=/opt/rocprofiler-sdk/lib:${LD_LIBRARY_PATH}
          cmake --build build-samples --parallel 16 && cmake --build build-tests --parallel 16
          ctest --test-dir build-samples --output-on-failure && ctest --test-dir build-tests --output-on-failure

      - name: Install & Test Packages
        if: ${{ contains(matrix.system.gpu, env.CORE_EXT_RUNNER) }}
        working-directory: projects/rocprofiler-sdk
        run: |
          dpkg --force-all -i ./build/rocprofiler-sdk-roctx_*.deb ./build/rocprofiler-sdk-rocpd_*.deb
          for i in $(ls -S ./build/rocprofiler-sdk*.deb | egrep -v 'roctx|rocpd'); do dpkg --force-all -i ${i}; done
          CMAKE_PREFIX_PATH=/opt/rocm cmake -B build-samples-deb /opt/rocm/share/rocprofiler-sdk/samples
          cmake --build build-samples-deb --parallel 16 && ctest --test-dir build-samples-deb --output-on-failure

      - uses: actions/upload-artifact@v4
        if: ${{ github.event_name == 'workflow_dispatch' && contains(matrix.system.gpu, env.CORE_EXT_RUNNER) }}
        with:
          name: installers-deb-${{ matrix.system.os }}-${{ matrix.system.gpu }}
          path: ${{github.workspace}}/projects/rocprofiler-sdk/build/*.deb

  core-rpm:
    name: Core • ${{ matrix.system.gpu }} • ${{ matrix.system.os }}
    needs: [discover-rocm-tarball]
    strategy:
      fail-fast: false
      matrix:
        system:
          - { os: 'rhel-8', runner: 'linux-mi325-1gpu-ossci-rocm', gpu: 'mi325', gpu-target: 'gfx94X-dcgpu', build-type: 'RelWithDebInfo', base-image: 'rockylinux:8.8' }
          - { os: 'rhel-9', runner: 'linux-mi325-1gpu-ossci-rocm', gpu: 'mi325', gpu-target: 'gfx94X-dcgpu', build-type: 'RelWithDebInfo', base-image: 'rockylinux:9' }
          - { os: 'sles-15', runner: 'linux-mi325-1gpu-ossci-rocm', gpu: 'mi325', gpu-target: 'gfx94X-dcgpu', build-type: 'RelWithDebInfo', base-image: 'opensuse/leap:15.6' }
    runs-on: ${{ matrix.system.runner }}
    container:
      image: ${{ matrix.system.base-image }}
      options: --privileged
    env:
      GIT_DISCOVERY_ACROSS_FILESYSTEM: 1
      TARBALL_VERSION: ${{ needs.discover-rocm-tarball.outputs.tarball_version }}
    steps:
      - name: Install dependencies (RHEL)
        if: ${{ contains(matrix.system.os, 'rhel') }}
        run: |
          dnf install -y epel-release || true
          dnf config-manager --set-enabled powertools || dnf config-manager --set-enabled crb || true
          dnf install -y --setopt=install_weak_deps=False ca-certificates curl wget git gcc gcc-c++ make cmake \
            python3 python3-pip python3-devel elfutils-libelf elfutils-libelf-devel numactl-libs numactl-devel ncurses-libs openssl-libs \
            sqlite-devel libdrm-devel perl file autoconf pkgconfig rpm-build kmod libzstd-devel ccache vim-common \
            mesa-libGL-devel mesa-libGLU-devel mesa-libEGL-devel ninja-build && dnf clean all

      - name: Install dependencies (SLES)
        if: ${{ contains(matrix.system.os, 'sles') }}
        run: |
          zypper --non-interactive refresh || true
          zypper --non-interactive install -y ca-certificates curl wget git gcc gcc-c++ make cmake ninja python3 python3-pip python3-devel \
            libelf1 libelf-devel libnuma1 libnuma-devel libncurses6 libopenssl1_1 sqlite3-devel libdrm-devel perl file autoconf pkg-config rpm-build kmod libzstd-devel ccache vim \
            Mesa-libGL-devel Mesa-libGLU-devel Mesa-libEGL-devel
          zypper clean --all

      - name: Install ROCm from nightly tarball
        run: |
          TARBALL_URL="https://rocm.nightlies.amd.com/tarball/therock-dist-linux-${{ matrix.system.gpu-target }}-${{ env.TARBALL_VERSION }}.tar.gz"
          echo "Installing ROCm from ${TARBALL_URL}"
          curl -fsSL -o /tmp/rocm.tar.gz "$TARBALL_URL"
          mkdir -p /opt/rocm && tar -xzf /tmp/rocm.tar.gz -C /opt/rocm --strip-components=1
          rm -f /tmp/rocm.tar.gz

      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            projects/rocprofiler-sdk
            projects/aqlprofile
            projects/rocprofiler-register
            projects/rocr-runtime
            projects/clr
            projects/hip
          submodules: false
          set-safe-directory: true

      - name: Init submodules
        run: git config --global --add safe.directory '*' && git submodule update --init --recursive --jobs 16

      - name: Install Python requirements
        working-directory: projects/rocprofiler-sdk
        run: |
          python3 -m pip install -U --user -r requirements.txt cmake==3.24.0 CppHeaderParser
          rm -rf /opt/rocm/lib/*rocprofiler-sdk* /opt/rocm/lib/cmake/*rocprofiler-sdk* /opt/rocm/share/*rocprofiler-sdk* /opt/rocm/libexec/*rocprofiler-sdk*

      - name: Setup environment
        run: |
          echo "PATH=$HOME/.local/bin:/opt/rocm/bin:/opt/rocm/llvm/bin:$PATH" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=/opt/rocm/lib:/opt/rocm/llvm/lib:${LD_LIBRARY_PATH}" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=/opt/amdgpu/lib64/pkgconfig:/opt/amdgpu/lib/pkgconfig:${PKG_CONFIG_PATH}" >> $GITHUB_ENV

      - uses: hendrikmuhs/ccache-action@63069e3931dedbf3b63792097479563182fe70d1
        with: { key: 'ccache-${{ matrix.system.os }}-${{ matrix.system.gpu }}', max-size: '2G', save: true }

      - name: Build ROCProfiler-Register
        working-directory: projects/rocprofiler-register
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_PREFIX_PATH=/opt/rocm -DCMAKE_INSTALL_PREFIX=/opt/rocm \
            -DCMAKE_C_COMPILER_LAUNCHER=/usr/bin/ccache -DCMAKE_CXX_COMPILER_LAUNCHER=/usr/bin/ccache .
          cmake --build build --parallel 16 && cmake --build build --target install

      - name: Build ROCR-Runtime
        if: ${{ env.ENABLE_ROCR_BUILD == 'true' }}
        working-directory: projects/rocr-runtime
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_PREFIX_PATH='/opt/rocm;/opt/rocm/llvm' -DCMAKE_INSTALL_PREFIX=/opt/rocm .
          cmake --build build --parallel 16 && cmake --build build --target install

      - name: Build HIP
        if: ${{ env.ENABLE_HIP_CLR_BUILD == 'true' }}
        working-directory: projects/clr
        run: |
          cmake -B build -DHIP_COMMON_DIR=${{ github.workspace }}/projects/hip -DCMAKE_BUILD_TYPE=RelWithDebInfo -DHIP_PLATFORM=amd \
            -DCMAKE_PREFIX_PATH='/opt/rocm;/opt/rocm/llvm' -DCMAKE_INSTALL_PREFIX=/opt/rocm -DHIP_LLVM_ROOT=/opt/rocm/lib/llvm \
            -DHIP_CATCH_TEST=0 -DCLR_BUILD_HIP=ON -DCLR_BUILD_OCL=OFF .
          cmake --build build --parallel 16 && cmake --build build --target install

      - name: Build Aqlprofile
        working-directory: projects/aqlprofile
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_PREFIX_PATH=/opt/rocm -DCMAKE_INSTALL_PREFIX=/opt/rocm \
            -DCMAKE_C_COMPILER_LAUNCHER=/usr/bin/ccache -DCMAKE_CXX_COMPILER_LAUNCHER=/usr/bin/ccache .
          cmake --build build --parallel 16 && cmake --build build --target install

      - name: Configure, Build, and Test
        timeout-minutes: 30
        working-directory: projects/rocprofiler-sdk
        run: |
          python3 ./source/scripts/run-ci.py -B build \
            --name ${{ github.repository }}-${{ github.ref_name }}-${{ matrix.system.os }}-${{ matrix.system.gpu }}-core \
            --mode ${CI_MODE} --build-jobs 16 --site ${{ matrix.system.runner }} \
            --gpu-targets ${{ env.GPU_TARGETS }} --run-attempt ${{ github.run_attempt }} -- \
            -DROCPROFILER_DEP_ROCMCORE=ON -DROCPROFILER_BUILD_DOCS=OFF -DROCPROFILER_INTERNAL_RCCL_API_TRACE=ON \
            -DCMAKE_BUILD_TYPE=${{ matrix.system.build-type }} -DCMAKE_PREFIX_PATH='/opt/rocm;/opt/rocm/llvm' \
            -DPython3_EXECUTABLE=$(which python3) ${{ env.GLOBAL_CMAKE_OPTIONS }} -- --parallel 4

  sanitizers:
    name: ${{ matrix.system.sanitizer }} • ${{ matrix.system.gpu }} • ${{ matrix.system.os }}
    needs: [discover-rocm-tarball]
    if: ${{ contains(github.event_name, 'pull_request') }}
    strategy:
      fail-fast: false
      matrix:
        system:
          - { sanitizer: 'AddressSanitizer', os: 'ubuntu-22.04', runner: 'linux-mi325-8gpu-ossci-rocm-sandbox', gpu: 'mi325', gpu-target: 'gfx94X-dcgpu', build-type: 'RelWithDebInfo' }
          - { sanitizer: 'ThreadSanitizer', os: 'ubuntu-22.04', runner: 'linux-mi325-8gpu-ossci-rocm-sandbox', gpu: 'mi325', gpu-target: 'gfx94X-dcgpu', build-type: 'RelWithDebInfo' }
          - { sanitizer: 'LeakSanitizer', os: 'ubuntu-22.04', runner: 'linux-mi325-8gpu-ossci-rocm-sandbox', gpu: 'mi325', gpu-target: 'gfx94X-dcgpu', build-type: 'RelWithDebInfo' }
          - { sanitizer: 'UndefinedBehaviorSanitizer', os: 'ubuntu-22.04', runner: 'linux-mi325-8gpu-ossci-rocm-sandbox', gpu: 'mi325', gpu-target: 'gfx94X-dcgpu', build-type: 'RelWithDebInfo' }
    runs-on: ${{ matrix.system.runner }}
    container:
      image: ubuntu:22.04
      options: --privileged --cap-add=SYS_PTRACE --security-opt seccomp=unconfined
    env:
      GIT_DISCOVERY_ACROSS_FILESYSTEM: 1
      DEBIAN_FRONTEND: noninteractive
      TARBALL_VERSION: ${{ needs.discover-rocm-tarball.outputs.tarball_version }}
      GCC_COMPILER_VERSION: 12
    steps:
      - name: Install dependencies
        run: |
          apt-get update && apt-get install -y --no-install-recommends \
            ca-certificates curl wget git build-essential cmake python3 python3-pip software-properties-common clang-15 \
            libasan8 libtsan2 libdw-dev libsqlite3-dev libdrm-dev file autoconf pkg-config ccache \
            libnuma-dev xxd libgl1-mesa-dev libglu1-mesa-dev libglx-dev libegl1-mesa-dev
          add-apt-repository ppa:ubuntu-toolchain-r/test && apt-get update
          apt-get install -y gcc-${{ env.GCC_COMPILER_VERSION }} g++-${{ env.GCC_COMPILER_VERSION }}
          update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-${{ env.GCC_COMPILER_VERSION }} 100 \
            --slave /usr/bin/g++ g++ /usr/bin/g++-${{ env.GCC_COMPILER_VERSION }} --slave /usr/bin/gcov gcov /usr/bin/gcov-${{ env.GCC_COMPILER_VERSION }}

      - name: Install ROCm from nightly tarball
        run: |
          TARBALL_URL="https://rocm.nightlies.amd.com/tarball/therock-dist-linux-${{ matrix.system.gpu-target }}-${{ env.TARBALL_VERSION }}.tar.gz"
          echo "Installing ROCm from ${TARBALL_URL}"
          curl -fsSL -o /tmp/rocm.tar.gz "$TARBALL_URL"
          mkdir -p /opt/rocm && tar -xzf /tmp/rocm.tar.gz -C /opt/rocm --strip-components=1
          rm -f /tmp/rocm.tar.gz

      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            projects/rocprofiler-sdk
            projects/aqlprofile
            projects/rocprofiler-register
            projects/rocr-runtime
            projects/clr
            projects/hip
          submodules: false
          set-safe-directory: true

      - name: Init submodules
        run: git config --global --add safe.directory '*' && git submodule update --init --recursive --jobs 16

      - name: Install Python requirements
        working-directory: projects/rocprofiler-sdk
        run: |
          python3 -m pip install -U --user -r requirements.txt cmake==3.24.0 CppHeaderParser
          rm -rf /opt/rocm/lib/*rocprofiler-sdk* /opt/rocm/lib/cmake/*rocprofiler-sdk* /opt/rocm/share/*rocprofiler-sdk* /opt/rocm/libexec/*rocprofiler-sdk*

      - name: Setup environment
        run: |
          echo "PATH=$HOME/.local/bin:/opt/rocm/bin:/opt/rocm/llvm/bin:$PATH" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=/opt/rocm/lib:/opt/rocm/llvm/lib:${LD_LIBRARY_PATH}" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=/opt/amdgpu/lib64/pkgconfig:/opt/amdgpu/lib/pkgconfig:${PKG_CONFIG_PATH}" >> $GITHUB_ENV

      - uses: hendrikmuhs/ccache-action@63069e3931dedbf3b63792097479563182fe70d1
        with: { key: 'ccache-${{ matrix.system.os }}-${{ matrix.system.gpu }}-${{ matrix.system.sanitizer }}', max-size: '2G', save: true }

      - name: Build ROCProfiler-Register
        working-directory: projects/rocprofiler-register
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_PREFIX_PATH=/opt/rocm -DCMAKE_INSTALL_PREFIX=/opt/rocm \
            -DCMAKE_C_COMPILER_LAUNCHER=/usr/bin/ccache -DCMAKE_CXX_COMPILER_LAUNCHER=/usr/bin/ccache .
          cmake --build build --parallel 16 && cmake --build build --target install

      - name: Build ROCR-Runtime
        if: ${{ env.ENABLE_ROCR_BUILD == 'true' }}
        working-directory: projects/rocr-runtime
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_PREFIX_PATH='/opt/rocm;/opt/rocm/llvm' -DCMAKE_INSTALL_PREFIX=/opt/rocm .
          cmake --build build --parallel 16 && cmake --build build --target install

      - name: Build HIP
        if: ${{ env.ENABLE_HIP_CLR_BUILD == 'true' }}
        working-directory: projects/clr
        run: |
          cmake -B build -DHIP_COMMON_DIR=${{ github.workspace }}/projects/hip -DCMAKE_BUILD_TYPE=RelWithDebInfo -DHIP_PLATFORM=amd \
            -DCMAKE_PREFIX_PATH='/opt/rocm;/opt/rocm/llvm' -DCMAKE_INSTALL_PREFIX=/opt/rocm -DHIP_LLVM_ROOT=/opt/rocm/lib/llvm \
            -DHIP_CATCH_TEST=0 -DCLR_BUILD_HIP=ON -DCLR_BUILD_OCL=OFF .
          cmake --build build --parallel 16 && cmake --build build --target install

      - name: Build Aqlprofile
        working-directory: projects/aqlprofile
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_PREFIX_PATH=/opt/rocm -DCMAKE_INSTALL_PREFIX=/opt/rocm \
            -DCMAKE_C_COMPILER_LAUNCHER=/usr/bin/ccache -DCMAKE_CXX_COMPILER_LAUNCHER=/usr/bin/ccache .
          cmake --build build --parallel 16 && cmake --build build --target install

      - name: Configure, Build, and Test with Sanitizer
        timeout-minutes: 45
        working-directory: projects/rocprofiler-sdk
        run: |
          sudo sysctl -w vm.mmap_rnd_bits=28 || true
          python3 ./source/scripts/run-ci.py -B build \
            --name ${{ github.repository }}-${{ github.ref_name }}-${{ matrix.system.os }}-${{ matrix.system.gpu }}-${{ matrix.system.sanitizer }} \
            --build-jobs 16 --site ${{ matrix.system.runner }} --gpu-targets ${{ env.GPU_TARGETS }} \
            --memcheck ${{ matrix.system.sanitizer }} --run-attempt ${{ github.run_attempt }} -- \
            -DROCPROFILER_INTERNAL_RCCL_API_TRACE=ON -DCMAKE_BUILD_TYPE=${{ matrix.system.build-type }} \
            -DCMAKE_INSTALL_PREFIX=/opt/rocm -DCMAKE_PREFIX_PATH='/opt/rocm;/opt/rocm/llvm' \
            -DPython3_EXECUTABLE=$(which python3) ${{ env.GLOBAL_CMAKE_OPTIONS }} -- --parallel 4
